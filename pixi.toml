[workspace]
name = "vksplat-sceneweave"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
setuptools = "*"
wheel = "*"
pybind11 = ">=2.11.1"
numpy = "*"
opencv = "*"
tqdm = "*"

[tasks]
build = "bash sceneweave/install.sh --skip-pixi-install"
smoke = "bash sceneweave/smoke.sh"
benchmark-help = "bash sceneweave/run_amd.sh ../sceneweave/benchmark.py --help"
